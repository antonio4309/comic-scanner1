<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comic Scanner AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .card {
      background: #111;
      border: 1px solid #272727;
      border-radius: 24px;
      padding: 20px;
      margin-top: 20px;
    }

    input, button {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      margin-top: 12px;
    }

    input {
      background: white;
      color: black;
    }

    button {
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: #16a34a;
    }

    button.secondary {
      background: #2563eb;
    }

    button.danger {
      background: #dc2626;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      color: #d4d4d4;
      margin-top: 14px;
      white-space: pre-wrap;
    }

    .progress-wrap {
      background: #272727;
      border-radius: 999px;
      overflow: hidden;
      height: 16px;
      margin-top: 16px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width 0.2s;
    }

    .queue {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .queue img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid #333;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .result-card {
      background: #111;
      border: 1px solid #272727;
      border-radius: 24px;
      overflow: hidden;
    }

    .result-card img {
      width: 100%;
      height: 460px;
      object-fit: cover;
    }

    .result-content {
      padding: 18px;
    }

    .price {
      margin-top: 14px;
      background: #052e16;
      border: 1px solid #15803d;
      border-radius: 16px;
      padding: 16px;
      font-size: 28px;
      font-weight: bold;
      color: #4ade80;
    }

    details {
      margin-top: 14px;
      background: #050505;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 12px;
    }

    pre {
      white-space: pre-wrap;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Comic Scanner AI</h1>
    <p>Batch scan up to 150 comics and export a Whatnot-ready CSV.</p>

    <div class="card">
      <input
        type="file"
        id="comicInput"
        accept="image/*"
        multiple
      />

      <button id="scanBtn">Analyze Batch</button>
      <button id="exportBtn" class="secondary" style="display:none;">
        Export Whatnot CSV
      </button>
      <button id="clearBtn" class="danger">
        Clear
      </button>

      <div class="status" id="status">Choose comics to scan.</div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="queue" id="previewGrid"></div>
    </div>

    <div class="results" id="resultsGrid"></div>
  </div>

  <script>
    const MAX_FILES = 150;
    const SCAN_DELAY_MS = 1200;

    const input = document.getElementById("comicInput");
    const scanBtn = document.getElementById("scanBtn");
    const exportBtn = document.getElementById("exportBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const previewGrid = document.getElementById("previewGrid");
    const resultsGrid = document.getElementById("resultsGrid");

    let selectedFiles = [];
    let results = [];
    let isScanning = false;

    input.addEventListener("change", () => {
      const files = Array.from(input.files || []);

      if (files.length > MAX_FILES) {
        alert(`Maximum ${MAX_FILES} comics at once.`);
        input.value = "";
        return;
      }

      selectedFiles = files;
      results = [];
      previewGrid.innerHTML = "";
      resultsGrid.innerHTML = "";
      exportBtn.style.display = "none";
      progressBar.style.width = "0%";

      files.forEach((file) => {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        previewGrid.appendChild(img);
      });

      statusEl.textContent = `${files.length} image(s) selected. Ready to scan.`;
    });

    clearBtn.addEventListener("click", () => {
      selectedFiles = [];
      results = [];
      input.value = "";
      previewGrid.innerHTML = "";
      resultsGrid.innerHTML = "";
      exportBtn.style.display = "none";
      progressBar.style.width = "0%";
      statusEl.textContent = "Cleared. Choose comics to scan.";
    });

    scanBtn.addEventListener("click", async () => {
      if (isScanning) return;

      if (!selectedFiles.length) {
        statusEl.textContent = "Please choose images first.";
        return;
      }

      isScanning = true;
      scanBtn.disabled = true;
      exportBtn.style.display = "none";
      results = [];
      resultsGrid.innerHTML = "";

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];

        statusEl.textContent = `Scanning ${i + 1} / ${selectedFiles.length}...`;

        try {
          const result = await scanSingleComic(file, i);
          results.push(result);
          renderResult(result);
        } catch (error) {
          const failResult = {
            imagePreview: URL.createObjectURL(file),
            imageUrl: "",
            comic: {
              title: "Error",
              issue: "",
              publisher: "",
              year: "",
              keyInfo: error.message || "Scan failed",
              condition: "Unknown",
              conditionReason: "Scan failed"
            },
            ebay: {},
            ebayAverage: null,
            whatnotPrice: null,
            searchQuery: ""
          };

          results.push(failResult);
          renderResult(failResult);
        }

        const percent = Math.round(((i + 1) / selectedFiles.length) * 100);
        progressBar.style.width = `${percent}%`;

        await delay(SCAN_DELAY_MS);
      }

      isScanning = false;
      scanBtn.disabled = false;
      exportBtn.style.display = results.length ? "block" : "none";
      statusEl.textContent = `Finished scanning ${results.length} comic(s).`;
    });

    exportBtn.addEventListener("click", exportWhatnotCSV);

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        const img = new Image();

        reader.onload = () => {
          img.src = reader.result;
        };

        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxWidth = 1200;
          const scale = Math.min(1, maxWidth / img.width);

          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);

          const ctx = canvas.getContext("2d");

          if (!ctx) {
            reject(new Error("Canvas failed"));
            return;
          }

          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const dataUrl = canvas.toDataURL("image/jpeg", 0.75);

          canvas.toBlob(
            (blob) => {
              if (!blob) {
                reject(new Error("Image compression failed"));
                return;
              }

              resolve({ blob, dataUrl });
            },
            "image/jpeg",
            0.75
          );
        };

        reader.onerror = () => reject(new Error("File reader failed"));
        img.onerror = () => reject(new Error("Image failed"));

        reader.readAsDataURL(file);
      });
    }

    async function uploadImage(blob, filename) {
      try {
        const response = await fetch("/api/upload-image.js", {
          method: "POST",
          headers: {
            "x-filename": filename
          },
          body: blob
        });

        const text = await response.text();

        let data;
        try {
          data = JSON.parse(text);
        } catch {
          console.warn("Upload returned non-JSON:", text);
          return "";
        }

        return data.url || "";
      } catch (error) {
        console.warn("Image upload failed:", error);
        return "";
      }
    }

    async function scanSingleComic(file, index) {
      const imagePreview = URL.createObjectURL(file);
      const compressed = await compressImage(file);

      const imageUrl = await uploadImage(
        compressed.blob,
        `comic-${Date.now()}-${index + 1}.jpg`
      );

      const identifyResponse = await fetch("/api/identify.js", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          image: compressed.dataUrl
        })
      });

      const identifyText = await identifyResponse.text();

      let identifyData;
      try {
        identifyData = JSON.parse(identifyText);
      } catch {
        throw new Error(`AI route returned non-JSON: ${identifyText.slice(0, 80)}`);
      }

      if (!identifyResponse.ok || identifyData.error) {
        throw new Error(identifyData.error || "AI scan failed");
      }

      const comic = identifyData.comic || identifyData;

      const searchQuery =
        comic.searchQuery ||
        comic.ebaySearchQuery ||
        `${comic.title || ""} ${comic.issue || ""} ${comic.publisher || ""} ${comic.year || ""}`.trim();

      const ebayUrl = `/api/ebay-search.js?q=${encodeURIComponent(searchQuery)}&condition=${encodeURIComponent(comic.condition || "")}`;

      const ebayResponse = await fetch(ebayUrl);
      const ebayText = await ebayResponse.text();

      let ebayData;
      try {
        ebayData = JSON.parse(ebayText);
      } catch {
        ebayData = {
          found: false,
          error: `eBay route returned non-JSON: ${ebayText.slice(0, 80)}`
        };
      }

      const ebayAverage =
        ebayData.marketPrice ||
        ebayData.median ||
        ebayData.average ||
        null;

      const whatnotPrice =
        ebayData.whatnotPrice ||
        calculateWhatnotPrice(ebayAverage);

      return {
        imagePreview,
        imageUrl,
        comic,
        ebay: ebayData,
        ebayAverage,
        whatnotPrice,
        searchQuery
      };
    }

    function calculateWhatnotPrice(value) {
      const number = Number(value);

      if (!number || Number.isNaN(number) || number <= 0) {
        return null;
      }

      return Math.ceil(number * 1.15);
    }

    function getSubcategory(year) {
      const number = Number(year);

      if (!number || Number.isNaN(number)) {
        return "Modern Comics";
      }

      return number < 1985 ? "Vintage Comics" : "Modern Comics";
    }

    function renderResult(item) {
      const card = document.createElement("div");
      card.className = "result-card";

      const priceText = item.whatnotPrice ? `£${item.whatnotPrice}` : "N/A";
      const ebayText = item.ebayAverage ? `£${Number(item.ebayAverage).toFixed(2)}` : "No price found";

      card.innerHTML = `
        <img src="${escapeHtml(item.imagePreview)}" alt="Comic" />

        <div class="result-content">
          <h2>${escapeHtml(item.comic.title || "Unknown")} #${escapeHtml(item.comic.issue || "")}</h2>

          <p><strong>Publisher:</strong> ${escapeHtml(item.comic.publisher || "Unknown")}</p>
          <p><strong>Year:</strong> ${escapeHtml(item.comic.year || "Unknown")}</p>
          <p><strong>Subcategory:</strong> ${escapeHtml(getSubcategory(item.comic.year))}</p>
          <p><strong>Condition:</strong> ${escapeHtml(item.comic.condition || "Unknown")}</p>
          <p><strong>Condition Reason:</strong> ${escapeHtml(item.comic.conditionReason || "Unknown")}</p>
          <p><strong>Key Info:</strong> ${escapeHtml(item.comic.keyInfo || "Unknown")}</p>
          <p><strong>eBay Query:</strong> ${escapeHtml(item.searchQuery || "")}</p>
          <p><strong>eBay Price:</strong> ${escapeHtml(ebayText)}</p>
          <p><strong>Image URL:</strong> ${
            item.imageUrl
              ? `<a href="${escapeHtml(item.imageUrl)}" target="_blank" style="color:#60a5fa;">Open image</a>`
              : "Missing"
          }</p>

          <div class="price">Whatnot Price: ${escapeHtml(priceText)}</div>

          <details>
            <summary>eBay Debug</summary>
            <pre>${escapeHtml(JSON.stringify(item.ebay, null, 2))}</pre>
          </details>
        </div>
      `;

      resultsGrid.appendChild(card);
    }

    function cleanCSVValue(value) {
      if (value === null || value === undefined) return "";

      return String(value)
        .replace(/"/g, '""')
        .replace(/\r/g, " ")
        .replace(/\n/g, " ")
        .trim();
    }

    function csvCell(value) {
      return `"${cleanCSVValue(value)}"`;
    }

    function exportWhatnotCSV() {
      if (!results.length) {
        statusEl.textContent = "No comics to export.";
        return;
      }

      const headers = [
        "Category",
        "Subcategory",
        "Title",
        "Description",
        "Quantity",
        "Type",
        "Price",
        "Shipping Profile",
        "Offerable",
        "Hazmat",
        "Condition",
        "Cost Per Item",
        "Sku",
        "Image URL 1",
        "Image URL 2",
        "Image URL 3",
        "Image URL 4",
        "Image URL 5",
        "Image URL 6",
        "Image URL 7",
        "Image URL 8"
      ];

      const rows = results.map((item) => {
        const title = `${item.comic.title || "Unknown"} #${item.comic.issue || ""}`.trim();

        return [
          "Comics & Manga",
          getSubcategory(item.comic.year),
          title,
          item.comic.keyInfo || item.comic.conditionReason || "Comic book listing",
          "1",
          "Buy it Now",
          item.whatnotPrice || "",
          "Bagged and boarded raw comic",
          "Yes",
          "Not Hazmat",
          item.comic.condition || "Very Fine",
          "",
          "",
          item.imageUrl || "",
          "",
          "",
          "",
          "",
          "",
          "",
          ""
        ];
      });

      const csvRows = [
        headers.map(csvCell).join(","),
        ...rows.map((row) => row.map(csvCell).join(","))
      ];

      const csvContent = csvRows.join("\r\n");

      const blob = new Blob([csvContent], {
        type: "text/csv;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "whatnot-comics.csv";

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);

      statusEl.textContent = "Whatnot CSV exported.";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
